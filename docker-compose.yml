version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: synthopsis-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_EMAIL=${SMTP_EMAIL:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - WHATSAPP_SERVICE_URL=${WHATSAPP_SERVICE_URL:-http://whatsapp-service:3006/send}
    volumes:
      - ./backend/synthopsis.db:/app/synthopsis.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - synthopsis-network

  whatsapp-service:
    build:
      context: ./whatsapp-service
      dockerfile: Dockerfile
    container_name: synthopsis-whatsapp
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
      - ORCHESTRATOR_URL=http://backend:8000/whatsapp-incoming
    volumes:
      - ./whatsapp-service/.wwebjs_auth:/app/.wwebjs_auth
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - synthopsis-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: synthopsis-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_URL=http://backend:8000
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - synthopsis-network

networks:
  synthopsis-network:
    driver: bridge
